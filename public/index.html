<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sarthi Rail — Log in</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="auth-page">
  <div class="auth-card">
    <div class="brand" style="margin-bottom:24px;"><span class="mark">✦</span> Sarthi Rail</div>

    <!-- LOGIN FORM -->
    <div id="loginView">
      <h1>Welcome back</h1>
      <p class="auth-sub">Log in to book or manage your journeys.</p>
      <div class="error-msg" id="loginError"></div>
      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email</label>
          <input type="email" id="loginEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" required autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary" id="loginSubmit">Log in</button>
      </form>
      <p class="switch-line">New to Sarthi Rail? <a id="toRegister">Create an account</a></p>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerView" style="display:none;">
      <h1>Create your account</h1>
      <p class="auth-sub">Your password is encrypted before it's ever stored.</p>
      <div class="error-msg" id="registerError"></div>
      <form id="registerForm">
        <div class="field">
          <label for="regName">Full name</label>
          <input type="text" id="regName" required>
        </div>
        <div class="field">
          <label for="regEmail">Email</label>
          <input type="email" id="regEmail" required autocomplete="email">
        </div>
        <div class="field">
          <label for="regPhone">Phone (optional)</label>
          <input type="tel" id="regPhone">
        </div>
        <div class="field">
          <label for="regPassword">Password</label>
          <input type="password" id="regPassword" required minlength="6" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary" id="registerSubmit">Create account</button>
      </form>
      <p class="switch-line">Already registered? <a id="toLogin">Log in</a></p>
    </div>
  </div>
</div>

<script src="js/auth.js"></script>
</body>
</html>
